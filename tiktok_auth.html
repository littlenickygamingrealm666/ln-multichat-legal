<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TikTok Auth Redirect</title>
  <style>
    body {
      background: #050509;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
  </style>
</head>
<body>
  <div>
    <h1>Completing TikTok Login…</h1>
    <p>You can close this window shortly.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    if (!code) {
      document.body.innerHTML = "<h1>Missing TikTok code</h1>";
    } else {
      // FINAL WORKING URL — matches your backend
      window.location.href =
        "http://localhost:16666/tiktok/exchange?code=" + encodeURIComponent(code);
    }
  </script>
</body>
</html>
