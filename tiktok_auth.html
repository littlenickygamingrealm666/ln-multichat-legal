<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TikTok Auth Redirect</title>
  <style>
    body {
      background: #050509;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .box {
      max-width: 480px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Completing TikTok Login…</h1>
    <p>You can close this window in a moment.</p>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");

      if (!code) {
        document.querySelector(".box").innerHTML =
          "<h1>Missing TikTok code</h1><p>No code parameter was found in the URL.</p>";
        return;
      }

      // Forward the code to your local backend
      const target = "http://localhost:3000/tiktok/exchange?code=" + encodeURIComponent(code);
      window.location.href = target;
    })();
  </script>
</body>
</html>
